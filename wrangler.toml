name = "inouee-annotation"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Static tool (public/index.html) is served directly by the Worker.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Video files. 500 MB uploads go through multipart on this binding.
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "inouee-annotation-videos"

# users / videos / tasks / anns — replaces the artifact `db` capability.
[[d1_databases]]
binding = "DB"
database_name = "inouee-annotation"
database_id = "PASTE_AFTER_wrangler_d1_create"

[vars]
# Your Zero Trust team domain, e.g. "anosupo" for anosupo.cloudflareaccess.com
ACCESS_TEAM = "CHANGE_ME"
# Application Audience (AUD) tag from the Access application's settings.
ACCESS_AUD = "CHANGE_ME"
